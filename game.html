<html>
<head>
    <title>RPG Game</title>

    <style>
        body {
            margin: 0;
            background-color: #111;
            font-family: Arial, sans-serif;
        }

        .scrolling-background {
            background-repeat: repeat-x;
            animation: scrollBackground 20s linear infinite;
        }

        @keyframes scrollBackground {
            from { background-position: 0 0; }
            to { background-position: -888.5px 0; }
        }

        #game_shell {
            width: 908px;
            height: 908px;
            border: 1px solid #222;
            display: flex;
            flex-direction: column;
            margin: auto;
            margin-top: 24px;
            position: relative;
            background-color: black;
            overflow: hidden;
        }

        #game_nav {
            width: 98%;
            height: 72px;
            border: 1px solid #222;
            display: flex;
            flex-direction: column;
            margin-left: 8px;
            background-color: ghostwhite;
            z-index: 50;
        }

        #player_hud {
            display: flex;
            flex-direction: row;
            border: 1px solid black;
            width: 884px;
            height: 32px;
            margin: 2px;
            background-color: gold;
            justify-content: space-between;
        }

        .hud_button {
            width: 120px;
            height: 28px;
            background-image: linear-gradient(#222, grey);
            margin: 2px;
            color: ghostwhite;
            text-align: center;
            justify-content: center;
            align-items: center;
            display: flex;
            cursor: pointer;
        }

        #game_viewport {
            width: 98%;
            height: 600px;
            border: 1px solid black;
            margin-left: 8px;
            margin-top: 2px;
            perspective: 800px;
            overflow: hidden;
            position: relative;
            background-color: #222;
        }

        .game_screen {
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
        }

        #world_map_screen {
            display: flex;
        }

        #room_screen {
            display: none;
        }

        #room_screen,
        #level_test_preview {
            perspective: 800px;
            transform-style: preserve-3d;
        }

        #battle_screen {
            display: none;
        }

        #world_map_preview,
        #level_test_preview {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            transform-style: preserve-3d;
        }

        #world_map_preview {
            perspective: 800px;
            transform-style: preserve-3d;
        }

        #level_test_holder {
            position: absolute;
            left: 0;
            top: 0;
            width: 840px;
            height: 840px;
            transform-style: preserve-3d;
        }

        #world {
            width: 840px;
            height: 840px;
            background-color: #222;
            display: grid;
            grid-template-columns: repeat(7, 120px);
            grid-template-rows: repeat(7, 120px);
            opacity: 1;
        }

        #level_test_controller_dpad {
            position: absolute;
            width: 120px;
            height: 120px;
            background-color: rgba(238, 130, 238, 0.244);
            border-radius: 96px;
            display: flex;
            flex-direction: column;
            bottom: 92px;
            left: 15px;
            z-index: 100;
        }

        .controller_button {
            width: 32px;
            height: 32px;
            border: #222 3px outset;
            border-radius: 32px;
            cursor: pointer;
            background-color: #222;
            color: ghostwhite;
            display: flex;
            flex-direction: column;
            text-align: center;
            justify-content: center;
        }

        .floating_window {
            position: absolute;
            background-color: ghostwhite;
            border: 1px solid black;
            display: none;
            flex-direction: column;
            z-index: 1000;
        }

        #fade_layer {
            position: absolute;
            inset: 0;
            background-color: black;
            opacity: 0;
            pointer-events: none;
            z-index: 2000;
        }

        .pause_member_card {
    width: 502px;
    height: 92px;
    border: 1px solid black;
    margin: 4px;
    display: flex;
    flex-direction: row;
    background-image: linear-gradient(#222, grey);
    color: white;
}

.pause_member_portrait {
    width: 86px;
    height: 86px;
    background-color: aliceblue;
    margin: 3px;
    background-size: cover;
    background-repeat: no-repeat;
    background-position: center;
}

.pause_member_text {
    width: 220px;
    height: 86px;
    margin: 3px;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    font-size: 13px;
}

.pause_member_stats {
    width: 140px;
    height: 86px;
    margin: 3px;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
}

.stat_bar {
    width: 120px;
    height: 8px;
    border: 1px outset white;
    border-radius: 8px;
    overflow: hidden;
    background-color: #111;
}

.stat_bar div {
    width: 0%;
    height: 100%;
    background-color: gold;
}
    </style>
</head>

    <script>
        window.addEventListener("load", function(){
            const fadeLayer = document.getElementById("fade_layer");
            const introPending = localStorage.getItem("new_game_intro_pending") === "true";

            function fadeInFromBlack(duration = 700){
                const fadeLayer = document.getElementById("fade_layer");
                if(!fadeLayer) return;

                fadeLayer.style.opacity = 1;
                fadeLayer.style.pointerEvents = "auto";

                fadeLayer.animate(
                    [{ opacity: 1 }, { opacity: 0 }],
                    { duration, fill: "forwards" }
                ).onfinish = function(){
                    fadeLayer.style.opacity = 0;
                    fadeLayer.style.pointerEvents = "none";
                };
            }

            const scene = localStorage.getItem("game_scene");
            const saved = JSON.parse(localStorage.getItem("saved_room_location") || "{}");

            console.log("Boot scene:", scene, saved);

            if(scene === "room" && saved.level_id !== undefined){
                worldMapActive = false;

                document.getElementById("world_map_screen").style.display = "none";
                document.getElementById("room_screen").style.display = "flex";

                if(typeof closeDestinationWindow === "function"){
                    closeDestinationWindow();
                }

                activeTeleportPrompt = null;
                teleportPromptOpen = false;
                teleportTransitioning = false;

                if(typeof worldTeleportCooldown !== "undefined"){
                    worldTeleportCooldown = Date.now() + 1200;
                }

                worldInput.left = false;
                worldInput.right = false;
                worldInput.up = false;
                worldInput.down = false;

                localStorage.setItem("test_level_id", String(saved.level_id));

                startRoomMode();

                if(introPending){
                    requestAnimationFrame(() => {
                        startOpeningCutscene();
                    });
                }else{
                    requestAnimationFrame(() => {
                        fadeInFromBlack(700);
                    });
                }

                return;
            }

            worldMapActive = true;

            document.getElementById("world_map_screen").style.display = "flex";
            document.getElementById("room_screen").style.display = "none";
        });
    </script>
